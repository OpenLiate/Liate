[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "liate"
version = "0.3.5"
description = "LIATE — Open Source OOP Framework for AI Agents · A Class is an Agent"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "OpenLiate", email = "vinod@openliate.tech" },
    { name = "Vinod Hatti", email = "vinod@openliate.tech" }
]
keywords = [
    "open-source-framework-for-ai-agents",
    "open-source",
    "framework",
    "ai-agents",
    "oop-framework",
    "liate",
    "openliate",
    "agent",
    "autonomous-agents",
    "sovereign-ai",
    "mcp",
    "sarvamai",
    "aum",
    "om"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.24.0",
]

[project.urls]
Homepage = "https://liate.dev"
Repository = "https://github.com/OpenLiate/Liate"
Documentation = "https://liate.dev"
Issues = "https://github.com/OpenLiate/Liate/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/liate", "src/openliate"]
